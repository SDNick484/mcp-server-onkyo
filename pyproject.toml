[project]
name = "mcp-server-onkyo"
version = "0.1.0"
description = "MCP server for controlling Onkyo AV receivers over eISCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.2"]
keywords = ["mcp", "model-context-protocol", "onkyo", "eiscp", "av-receiver", "home-automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-onkyo"
Issues = "https://github.com/SDNick484/mcp-server-onkyo/issues"

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]

[project.scripts]
mcp-server-onkyo = "onkyo_mcp:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
include = ["onkyo_mcp.py"]

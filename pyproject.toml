[project]
name = "mcp-server-onkyo"
version = "0.1.0"
description = "MCP server for controlling Onkyo AV receivers over eISCP"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Nicholas E. Andrade" }]
requires-python = ">=3.11"
dependencies = [
    "mcp>=2.2",
    "pyjwt[crypto]>=2.10",   # verifying Cloudflare Access assertions (onkyo_remote.py)
    "uvicorn>=0.31",         # the HTTP transport (onkyo_remote.py)
]
keywords = ["mcp", "model-context-protocol", "onkyo", "eiscp", "av-receiver", "home-automation"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Home Automation",
    "Topic :: Multimedia :: Sound/Audio",
]

[project.urls]
Homepage = "https://github.com/SDNick484/mcp-server-onkyo"
Issues = "https://github.com/SDNick484/mcp-server-onkyo/issues"

[project.optional-dependencies]
dev = ["pytest", "anyio", "httpx2"]

[project.scripts]
mcp-server-onkyo = "onkyo_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/onkyo_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
